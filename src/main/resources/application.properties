server.port=8080
spring.application.name=tickets-service

#base de datos
spring.datasource.url=jdbc:h2:file:/mnt/efs/ticketsdb;AUTO_SERVER=TRUE
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

#carpeta donde se montan los tickets generados
app.efs.path=${EFS_PATH:/mnt/efs}
#true = borra el pdf del efs despues de subirlo al s3 
app.efs.eliminar-tras-subir=${EFS_ELIMINAR_TRAS_SUBIR:false}

#aws s3
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${S3_BUCKET:tickets-eventos-ggana}

spring.servlet.multipart.max-file-size=10MB

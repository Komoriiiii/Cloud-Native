name: Deploy to Amazon EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tickets-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tickets-service:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar contenedor en EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/tickets-service:latest
            docker stop tickets-service || true
            docker rm tickets-service || true
            sudo fuser -k 8080/tcp || true
            docker run -d --name tickets-service --restart unless-stopped \
              -p 8080:8080 \
              -v /mnt/efs:/mnt/efs \
              -e EFS_PATH=/mnt/efs/tickets \
              -e DB_URL=jdbc:h2:file:/mnt/efs/data/ticketsdb \
              -e S3_BUCKET=${{ secrets.S3_BUCKET }} \
              -e AWS_REGION=${{ secrets.AWS_REGION }} \
              -e JAVA_TOOL_OPTIONS="-Xmx400m" \
              ${{ secrets.DOCKERHUB_USERNAME }}/tickets-service:latest
            sleep 15
            docker logs --tail 40 tickets-service
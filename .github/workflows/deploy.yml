name: Deploy to Amazon EC2
 
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Copy JAR to EC2 via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: 54.196.144.237
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "target/tickets-service-1.0.0.jar"
        target: "/home/ec2-user/"
        overwrite: true

    - name: Start Application on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: 54.196.144.237
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          sudo fuser -k 8080/tcp || true
          pkill -f java || true
          cd /home/ec2-user
          mv target/tickets-service-1.0.0.jar .
          nohup java -jar tickets-service-1.0.0.jar > app.log 2>&1 &